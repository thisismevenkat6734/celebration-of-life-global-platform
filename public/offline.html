
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7c3aed">
  <meta name="robots" content="noindex, nofollow">
  <title>You're Offline | COL</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #252044;
      background: linear-gradient(135deg, #fce7f3, #ede9fe, #ffedd5);
      text-align: center;
    }

    main {
      width: 100%;
      max-width: 440px;
      padding: 36px 24px;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 24px;
      box-shadow: 0 16px 48px rgba(60, 30, 100, 0.12);
    }

    .symbol {
      font-size: 58px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
    }

    p {
      color: #625d75;
      line-height: 1.7;
    }

    button {
      margin-top: 18px;
      padding: 14px 24px;
      border: 0;
      border-radius: 999px;
      color: white;
      background: #7c3aed;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 3px solid #252044;
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <main>
    <div class="symbol" aria-hidden="true">🌈</div>
    <h1>You're offline</h1>
    <p>
      Your beautiful moments are waiting.
      Please check your internet connection
      and try again.
    </p>
    <button type="button" onclick="window.location.reload()">
      Try Again
    </button>
  </main>
</body>
</html>
